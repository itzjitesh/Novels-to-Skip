# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
# Fill in the secret values in the Render dashboard after the first deploy.
services:
  - type: web
    name: novels-to-skip
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: SITE_URL
        sync: false
      - key: AUTO_PUBLISH_USER_POSTS
        value: "false"
      - key: ANTHROPIC_API_KEY
        sync: false
